<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>EstateForce | Real Estate Salesforce Package</title>
    <meta name="description" content="Manage every lead, sale and booking in one place, natively on Salesforce. The premier real estate CRM package for builders, developers and brokerages." />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Skip to main content link for accessibility (US-35) -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    
    <!-- Global Header Mount Point (US-01) -->
    <div id="header-root"></div>
    
    <!-- Main Content Container -->
    <main id="main-content">
      <!-- We will mount page sections here as we build them story by story -->
      <div id="app"></div>
    </main>

    <!-- Global Footer Mount Point (US-02) -->
    <div id="footer-root"></div>

    <!-- Floating Chat / WhatsApp Mount Point (US-03) -->
    <div id="floating-chat-root"></div>

    <!-- Exit-Intent Recovery Modal Mount Point (US-32) -->
    <div id="exit-intent-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
