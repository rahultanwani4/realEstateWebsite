    <!-- Simulated Mobile Card inside Dashboard -->
    <g transform="translate(14, 38)">
      <rect width="332" height="126" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
      <div style="display:flex;"></div>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#166534" font-weight="700">📱 10-Second Unit Lock: Unit C-804</text>
      <text x="12" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#334155">Client: Dr. Rajesh Grover • Flat: 3BHK East Facing (1,840 sq ft)</text>
      <text x="12" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#334155">Special Token Hold: ₹1,00,000 received • Hold Expires: 59m 40s</text>
      
