      <text x="20" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#0F172A" font-weight="700">Sunita Sen (MagicBricks)</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">3BHK • Assigned to Rep: Priya K. • SLA: 2 mins remaining</text>
