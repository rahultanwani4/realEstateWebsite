      <text x="10" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#64748B">Unit B-604 (₹2.40 Cr) • 2.5% Super Slab</text>
      <text x="10" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#2563EB" font-weight="800">₹6,00,000 Verification Pending</text>
