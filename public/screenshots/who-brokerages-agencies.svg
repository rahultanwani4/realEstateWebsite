      <text x="20" y="87" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#0F172A" font-weight="700">Amitabh Joshi (99acres)</text>
      <text x="20" y="100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">Villa Plot • Assigned to Rep: Rahul D. • WhatsApp greeting sent</text>
      <rect x="248" y="78" width="64" height="22" rx="3" fill="#ECFDF5"/>
      <text x="258" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#059669" font-weight="700">Connected</text>
