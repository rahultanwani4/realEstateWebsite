      <text x="12" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#4B5563">Approved for Payout: ₹42,50,000</text>
      <text x="12" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#4B5563">Earned in Pipeline: ₹99,50,000</text>
      <text x="12" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#4B5563">Dispute Claims: 0 (100% Audit Tracked)</text>

      <rect x="12" y="90" width="256" height="26" rx="4" fill="#0F766E"/>
      <text x="68" y="107" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Download Partner Statement ↗</text>
