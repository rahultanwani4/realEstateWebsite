    <text x="16" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#CCFBF1">Active Mandates: 6 Projects • MTD Closures: 28 Units • Earned Commission: ₹1.42 Cr</text>
    <rect x="560" y="14" width="104" height="24" rx="4" fill="#14B8A6"/>
    <text x="572" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700">Live Network</text>
  </g>

