  <line x1="0" y1="36" x2="720" y2="36" stroke="#E2E8F0"/>
  <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
  <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
  <circle cx="52" cy="18" r="4.5" fill="#10B981"/>
  <rect x="74" y="9" width="340" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="86" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#64748B">estateforce.lightning.force.com/agency/partner-network/brokerage</text>
  <rect x="580" y="9" width="124" height="18" rx="9" fill="#F0FDFA"/>
  <text x="590" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#0F766E" font-weight="700">Brokerage Portal</text>

  <!-- Agency Header Banner -->
  <g transform="translate(20, 48)">
