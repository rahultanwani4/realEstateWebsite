<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="840" height="500" rx="14" fill="url(#bgGlow)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top App Window Bar -->
  <path d="M0 14 Q0 0 14 0 L826 0 Q840 0 840 14 L840 38 L0 38 Z" fill="#FFFFFF"/>
  <line x1="0" y1="38" x2="840" y2="38" stroke="#E2E8F0"/>
  <circle cx="22" cy="19" r="4.5" fill="#EF4444"/>
  <circle cx="38" cy="19" r="4.5" fill="#F59E0B"/>
  <circle cx="54" cy="19" r="4.5" fill="#10B981"/>
  <rect x="76" y="10" width="340" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="88" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748B">estateforce.lightning.force.com/benefits#roi-calculator</text>
  <rect x="680" y="10" width="144" height="20" rx="10" fill="#EFF6FF"/>
  <text x="694" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#2563EB" font-weight="700">US-11: ROI Calculator</text>

  <!-- Section Header -->
  <g transform="translate(32, 54)">
    <rect width="168" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="14" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#2563EB" font-weight="700">INTERACTIVE BUSINESS CASE</text>
    
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#0F172A" font-weight="800">Calculate Your Team's Projected ROI</text>
    <text x="0" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#64748B">Estimate deal recovery, reclaimed rep hours, and sales turnover modeled on 50,000+ units managed.</text>
    
    <!-- Currency Toggle -->
    <g transform="translate(600, 16)">
      <rect width="176" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0"/>
      <rect x="2" y="2" width="86" height="26" rx="13" fill="#2563EB"/>
      <text x="12" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700">₹ INR (Lakhs/Cr)</text>
      <text x="98" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#64748B" font-weight="600">$ USD (Million)</text>
    </g>
  </g>

  <!-- TWO-COLUMN WORKSPACE LAYOUT -->
  <g transform="translate(32, 134)">
    
    <!-- LEFT COLUMN: REACTIVE SLIDERS & INPUTS -->
    <g transform="translate(0, 0)">
      <rect width="360" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
      <text x="18" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#0F172A" font-weight="800">Operational Inputs</text>
      
      <!-- Input 1: Sales Team Size -->
      <g transform="translate(18, 42)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#334155" font-weight="600">Active Sales Team Size</text>
        <rect x="264" y="-2" width="60" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="274" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#0F172A" font-weight="700">15 reps</text>
        <!-- Range Track -->
        <rect x="0" y="22" width="324" height="6" rx="3" fill="#E2E8F0"/>
        <rect x="0" y="22" width="60" height="6" rx="3" fill="#2563EB"/>
        <circle cx="60" cy="25" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      </g>

      <!-- Input 2: Monthly Inbound Leads -->
      <g transform="translate(18, 106)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#334155" font-weight="600">Monthly Inbound Leads</text>
        <rect x="246" y="-2" width="78" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="254" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#0F172A" font-weight="700">600 leads</text>
        <!-- Range Track -->
        <rect x="0" y="22" width="324" height="6" rx="3" fill="#E2E8F0"/>
        <rect x="0" y="22" width="85" height="6" rx="3" fill="#2563EB"/>
        <circle cx="85" cy="25" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      </g>

      <!-- Input 3: Average Unit Price -->
      <g transform="translate(18, 170)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#334155" font-weight="600">Average Property Price</text>
        <rect x="238" y="-2" width="86" height="22" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
        <text x="246" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#2563EB" font-weight="800">₹85.0 Lakhs</text>
        <!-- Range Track -->
        <rect x="0" y="22" width="324" height="6" rx="3" fill="#E2E8F0"/>
        <rect x="0" y="22" width="110" height="6" rx="3" fill="#2563EB"/>
        <circle cx="110" cy="25" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      </g>

      <!-- Input 4: Current Conversion Rate -->
      <g transform="translate(18, 234)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#334155" font-weight="600">Current Conversion Rate</text>
        <rect x="264" y="-2" width="60" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="278" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#0F172A" font-weight="700">2.5%</text>
        <!-- Range Track -->
        <rect x="0" y="22" width="324" height="6" rx="3" fill="#E2E8F0"/>
        <rect x="0" y="22" width="120" height="6" rx="3" fill="#2563EB"/>
        <circle cx="120" cy="25" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      </g>

      <!-- Benchmark Transparency Pill -->
      <g transform="translate(18, 298)">
        <rect width="324" height="26" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="10" y="17" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#64748B">ⓘ Assumptions: 3.5 hrs/rep/wk saved • 28% SLA speed uplift • 2.0% broker fee</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: PROJECTED ROI OUTPUTS & COMPARISON BAR -->
    <g transform="translate(384, 0)">
      <rect width="392" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>

      <!-- Primary Impact Banner -->
      <g transform="translate(16, 16)">
        <rect width="360" height="96" rx="10" fill="url(#primaryGrad)"/>
        <text x="16" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#BFDBFE" font-weight="700">PROJECTED ANNUAL SALES UPSIDE</text>
        <rect x="278" y="10" width="70" height="22" rx="11" fill="#FFFFFF"/>
        <text x="286" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#1D4ED8" font-weight="800">18.8x ROI</text>
        
        <text x="16" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" fill="#FFFFFF" font-weight="900">₹42.50 Cr</text>
        <text x="16" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#E0E7FF">Accelerated Gross Booking Turnover</text>

        <rect x="226" y="52" width="122" height="26" rx="13" fill="rgba(255,255,255,0.18)"/>
        <text x="238" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">+50 Units / yr</text>
      </g>

      <!-- 2 Small Metric Cards -->
      <g transform="translate(16, 122)">
        <!-- Hours Reclaimed Card -->
        <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="12" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B" font-weight="600">Hours Reclaimed</text>
        <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#0F172A" font-weight="800">2,625 hrs</text>
        <text x="12" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#10B981" font-weight="700">+1.3 FTE reps added</text>

        <!-- Margin Gained Card -->
        <g transform="translate(186, 0)">
          <rect width="174" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="12" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B" font-weight="600">Brokerage Saved</text>
          <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#0F172A" font-weight="800">₹85.00 L</text>
          <text x="12" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#2563EB" font-weight="700">At 2.0% broker fee</text>
        </g>
      </g>

      <!-- Comparison Progress Bar -->
      <g transform="translate(16, 202)">
        <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#0F172A" font-weight="700">Annual Unit Bookings Comparison</text>
        <text x="270" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#64748B">180 vs 230 Units</text>

        <!-- Bar Track -->
        <rect x="0" y="22" width="360" height="24" rx="5" fill="#F1F5F9"/>
        <rect x="0" y="22" width="276" height="24" rx="5" fill="#94A3B8"/>
        <text x="12" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700">Baseline (180)</text>

        <rect x="276" y="22" width="84" height="24" rx="5" fill="#10B981"/>
        <text x="286" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700">+50 Won</text>

        <circle cx="4" cy="58" r="3.5" fill="#94A3B8"/>
        <text x="14" y="61" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#64748B">Without EstateForce</text>
        <circle cx="150" cy="58" r="3.5" fill="#10B981"/>
        <text x="160" y="61" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#10B981" font-weight="700">Incremental Bookings (+28%)</text>
      </g>

      <!-- CTA Button -->
      <g transform="translate(16, 280)">
        <rect width="360" height="42" rx="21" fill="#2563EB"/>
        <text x="82" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700">Claim Your Custom ROI Assessment →</text>
      </g>
    </g>

  </g>
</svg>
